# =============================================================================
# CI/CD pipeline for umo-plugins (CWN-5206)
#
# Acts as a security gate before the public GitHub mirror push (configured at
# the GitLab project level: Settings → Repository → Mirroring).
#
# All jobs are pulled from the shared ci-cd-templates repo via `include:`.
# Do not copy-paste shared job logic here — extend or override fields only.
# =============================================================================

include:
  - project: "umo-tech-ltd-group/DevOps/ci-cd-templates"
    ref: main
    file:
      # Secret detection — blocks any MR or push to main on leak.
      - "/jobs/gitleaks.yml"
      # Vuln + misconfig + secret scan over the whole repo (no services/* layout).
      - "/jobs/trivy-fs-flat.yml"
      # SAST + Quality Gate. Uncomment after creating SonarQube project
      # `ai_umo-plugins` and setting SONAR_TOKEN in GitLab CI/CD variables.
      # - "/jobs/sonarqube.yml"
      # Node lint — no-op until a package.json with a `lint` script appears;
      # auto-activates as soon as one is added.
      - "/jobs/lint-node.yml"

stages:
  - Lint & Security Scan

variables:
  GIT_DEPTH: "0"
  # SONAR_USER_HOME and SONAR_SOURCES are required when /jobs/sonarqube.yml is enabled.
  # SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  # SONAR_SOURCES: "."
  PNPM_VERSION: "10.0.0"

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never

# -----------------------------------------------------------------------------
# Manifest validation
#
# Validates: JSON syntax for plugin/marketplace manifests, YAML frontmatter on
# skill/command docs. `claude plugin validate .` is skipped on CI (no CLI).
# -----------------------------------------------------------------------------
validate_manifests:
  stage: Lint & Security Scan
  image: public.ecr.aws/docker/library/python:3.12-alpine
  tags: ["arm-runner"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
      allow_failure: false
    - when: never
  before_script:
    - apk add --no-cache bash
    - pip install --quiet --root-user-action=ignore pyyaml
  script:
    - bash scripts/validate-claude.sh
