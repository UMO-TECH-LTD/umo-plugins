sonar.projectKey=ai_umo-plugins
sonar.qualitygate.wait=true
sonar.filesize.limit=300

# Project metadata
sonar.projectName=UMO Plugins
sonar.projectVersion=1.0.0
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions — assets, generated and IDE configs
sonar.exclusions=**/assets/**,**/.cursor/**,**/.vscode/**,**/.sonarlint/**,**/*.min.js,**/*.min.css,**/*.svg,**/*.png

# Coverage exclusions — no test coverage in this repo (shell/scripts/configs)
sonar.coverage.exclusions=**/*
