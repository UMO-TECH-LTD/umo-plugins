# Trivy custom secret detection rules for umo-plugins repo.
#
# Mirrors .gitleaks.toml — adds detection for UMO-internal token formats that
# default Trivy and gitleaks rule catalogs do not recognize:
#   - DAVID API Key (`dak_<hex>`) used by Brain MCP
#   - BRAIN_MCP_API_KEY literal (acceptance criterion in CWN-5206)
#
# Trivy's secret scanner uses keyword+regex pairs (not generic entropy like
# gitleaks), so each custom prefix needs an explicit rule. Add more as new
# internal token formats appear.
#
# Docs: https://trivy.dev/latest/docs/scanner/secret/#custom-rules

rules:
  - id: umo-brain-mcp-api-key-literal
    category: UMO
    title: BRAIN_MCP_API_KEY literal committed (env placeholder only allowed)
    severity: CRITICAL
    regex: '(?i)BRAIN[_-]?MCP[_-]?API[_-]?KEY\s*[=:]\s*[''"]?[A-Za-z0-9._\-]{16,}[''"]?'
    keywords:
      - BRAIN_MCP_API_KEY
      - brain_mcp_api_key

  - id: umo-dak-token
    category: UMO
    title: DAVID API Key (dak_ prefix)
    severity: CRITICAL
    regex: 'dak_[A-Fa-f0-9]{32,}'
    keywords:
      - dak_

allowlist:
  description: Patterns that look like the rules above but are not real secrets
  regexes:
    # Env-var placeholder for BRAIN_MCP_API_KEY (legitimate in mcp.json)
    - '\$\{?env:BRAIN_MCP_API_KEY\}?'
  paths:
    # Allow our own config files that reference the patterns in regex form
    - '\.gitleaks\.toml'
    - 'trivy-secret\.yaml'
