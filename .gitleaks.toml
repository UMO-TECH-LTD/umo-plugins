# gitleaks config for umo-plugins repo.
#
# Extends gitleaks' built-in detection (AWS, GCP, GitHub, Slack, Stripe, JWT,
# private keys, etc.) with:
#   - a high-entropy catch-all for non-standard token shapes (e.g. values that
#     generic-api-key may miss in JSON)
#   - an explicit BRAIN_MCP_API_KEY literal rule (acceptance criterion in
#     CWN-5206 — that variable's value must never be committed)
#
# plugins/umo-effect is bundled Effect skill text + plugin metadata — high-entropy
# noise from path-like tokens; excluded globally (do not commit real secrets there).
#
# Docs: https://github.com/gitleaks/gitleaks#configuration

[extend]
useDefault = true

[allowlist]
description = "umo-effect bundle (agent docs / manifests; not for credentials)"
paths = [
  '''plugins/umo-effect/.*''',
]

# ─────────────────────────────────────────────────────────────────────
# High-entropy catch-all for non-standard token formats.
# ─────────────────────────────────────────────────────────────────────

[[rules]]
  id          = "high-entropy-string"
  description = "Generic high-entropy token (potential secret)"
  regex       = '''[A-Za-z0-9+/=_\-]{20,}'''
  entropy     = 3.5
  tags        = ["entropy", "generic"]

  [rules.allowlist]
    description = "Expected high-entropy non-secrets"
    regexes = [
      '''\$\{?env:[A-Z_][A-Z0-9_]*\}?''',
      '''\$\{?CI_[A-Z0-9_]+\}?''',
      '''sha256:[a-f0-9]{64}''',
      '''(?i)(commit|sha)[/=:][a-f0-9]{40}''',
    ]
    paths = [
      '''\.gitleaks\.toml''',
      '''trivy-secret\.yaml''',
    ]

# ─────────────────────────────────────────────────────────────────────
# BRAIN_MCP_API_KEY literal must never be committed (env placeholder only).
# ─────────────────────────────────────────────────────────────────────

[[rules]]
  id          = "brain-mcp-api-key-literal"
  description = "BRAIN_MCP_API_KEY literal must never be committed (env placeholder only)"
  regex       = '''(?i)BRAIN[_-]?MCP[_-]?API[_-]?KEY\s*[=:]\s*['"]?[A-Za-z0-9._\-]{16,}['"]?'''
  tags        = ["umo-plugins", "brain-mcp"]

  [rules.allowlist]
    description = "Env placeholder is fine — only literal values block"
    regexes = [
      '''\$\{?env:BRAIN_MCP_API_KEY\}?''',
    ]
